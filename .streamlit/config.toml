[theme]
base = "dark"
primaryColor = "#00d4ff"
backgroundColor = "#0a0e27"
secondaryBackgroundColor = "#1a1f3a"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = false
address = "127.0.0.1"
port = 8501
